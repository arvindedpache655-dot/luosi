name: Build Android APK

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Auto Extract ZIP if Uploaded Directly
        run: |
          shopt -s nullglob
          for z in *.zip; do
            echo "Found zip file $z, extracting..."
            unzip -o "$z"
          done

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Build Debug & Release APK
        run: |
          GRADLE_FILE=$(find . -maxdepth 3 -name "settings.gradle" | head -n 1)
          if [ -z "$GRADLE_FILE" ]; then
            echo "Error: settings.gradle not found! Please make sure you uploaded the project files."
            exit 1
          fi
          PROJECT_DIR=$(dirname "$GRADLE_FILE")
          echo "Building Android project in: $PROJECT_DIR"
          cd "$PROJECT_DIR"
          gradle assembleDebug assembleRelease --no-daemon

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ScrewPuzzle-debug-apk
          path: "**/build/outputs/apk/debug/*.apk"

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ScrewPuzzle-release-apk
          path: "**/build/outputs/apk/release/*.apk"
